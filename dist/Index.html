<!-- ========================================================================
     ระบบคะแนนความประพฤตินักเรียน โรงเรียนจุนวิทยาคม — หน้าเว็บทั้งหมด
     ไฟล์นี้สร้างอัตโนมัติจาก  node build/bundle.js  — อย่าแก้ไขไฟล์นี้โดยตรง
     รวมจาก: Index.html, Style.html, Script.html, ScriptCharts.html, ScriptViews.html
     ======================================================================== -->
<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#184f95">
  <title>ระบบคะแนนความประพฤตินักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">

<!-- ================================================================== -->
<!-- Style.html -->
<!-- ================================================================== -->
<style>
/* ==================================================================
   ระบบคะแนนความประพฤตินักเรียน — ระบบดีไซน์
   สีชุดข้อมูลผ่านการตรวจ CVD (ตาบอดสี) แล้ว: น้ำเงิน #2a78d6 คู่ ส้ม #eb6834
   ================================================================== */

:root {
  color-scheme: light;
  --bg:        #f9f9f7;
  --surface:   #fcfcfb;
  --surface-2: #f2f1ed;
  --surface-3: #e8eef7;
  --ink:       #0b0b0b;
  --ink-2:     #52514e;
  --muted:     #898781;
  --line:      #e1e0d9;
  --line-2:    #c3c2b7;

  --brand:     #184f95;
  --brand-2:   #2a78d6;
  --brand-soft:#e8f0fc;

  --series-1:  #2a78d6;   /* ความดี */
  --series-2:  #eb6834;   /* ความผิด */

  --good:      #0ca30c;
  --warning:   #fab219;
  --serious:   #ec835a;
  --critical:  #d03b3b;
  --good-soft: #e6f6e6;
  --warn-soft: #fdf3dc;
  --crit-soft: #fbe9e9;

  --radius:    14px;
  --radius-sm: 10px;
  --shadow:    0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.05);
  --shadow-lg: 0 8px 32px rgba(11,11,11,.14);
  --nav-w:     248px;
  --font: "Sarabun", "TH Sarabun New", system-ui, -apple-system, "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:        #0d0d0d;
    --surface:   #1a1a19;
    --surface-2: #242422;
    --surface-3: #1e2836;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --line:      #2c2c2a;
    --line-2:    #383835;
    --brand:     #3987e5;
    --brand-2:   #3987e5;
    --brand-soft:#16263c;
    --series-1:  #3987e5;
    --series-2:  #d95926;
    --good-soft: #122812;
    --warn-soft: #2e2513;
    --crit-soft: #2e1616;
    --shadow:    0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.55);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { margin: 0; font-weight: 700; line-height: 1.3; }
p { margin: 0 0 .6em; }
a { color: var(--brand-2); }

/* ---------------- โครงหน้า ---------------- */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: var(--nav-w);
  flex: 0 0 var(--nav-w);
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 18px 12px;
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 16px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 11px; flex: 0 0 38px;
  background: linear-gradient(140deg, var(--brand-2), var(--brand));
  color: #fff; display: grid; place-items: center; font-size: 19px;
}
.brand-text { min-width: 0; }
.brand-text b { display: block; font-size: 14.5px; line-height: 1.25; }
.brand-text span { font-size: 12px; color: var(--muted); }

.navlink {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--ink-2); text-decoration: none; font-size: 14.5px;
  border: none; background: none; width: 100%; cursor: pointer;
  font-family: inherit; text-align: left;
}
.navlink:hover { background: var(--surface-2); color: var(--ink); }
.navlink.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.navlink .ico { font-size: 17px; width: 22px; text-align: center; }
.navlink .pill {
  margin-left: auto; background: var(--critical); color: #fff;
  font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 20px;
}
.nav-sep { height: 1px; background: var(--line); margin: 10px 8px; }
.nav-foot { margin-top: auto; padding: 12px 8px 0; font-size: 12px; color: var(--muted); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px; background: var(--surface);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30;
}
.topbar h1 { font-size: 19px; }
.topbar .sub { font-size: 12.5px; color: var(--muted); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brand-soft); color: var(--brand);
  display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: 0 0 36px;
}
.who { text-align: right; line-height: 1.25; }
.who b { font-size: 13.5px; display: block; }
.who span { font-size: 11.5px; color: var(--muted); }

.content { padding: 22px; max-width: 1280px; width: 100%; }
.mobile-nav, .mobile-bar { display: none; }

/* ---------------- การ์ด ---------------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-head h3 { font-size: 15.5px; }
.card-head .hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.card-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }

.grid { display: grid; gap: 16px; align-items: start; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }
.span-2 { grid-column: span 2; }

/* ---------------- ตัวเลขสรุป ---------------- */
.stat { display: flex; flex-direction: column; gap: 3px; }
.stat .label { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.stat .value { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; }
.stat .unit { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat .foot { font-size: 12px; color: var(--muted); }
.stat-icon {
  width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
  font-size: 15px; background: var(--surface-2);
}

/* ---------------- ปุ่ม ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-sm); border: 1px solid var(--line-2);
  background: var(--surface); color: var(--ink); font-family: inherit;
  font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
  transition: background .12s, border-color .12s, transform .06s;
  min-height: 40px;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: var(--brand-2); border-color: var(--brand-2); }
.btn-good { background: var(--good); border-color: var(--good); color: #fff; }
.btn-good:hover { filter: brightness(1.08); background: var(--good); }
.btn-danger { background: var(--critical); border-color: var(--critical); color: #fff; }
.btn-danger:hover { filter: brightness(1.08); background: var(--critical); }
.btn-ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { padding: 6px 11px; font-size: 13px; min-height: 32px; }
.btn-block { width: 100%; }

/* ---------------- ฟอร์ม ---------------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--ink-2); }
.field .help { font-size: 12px; color: var(--muted); margin-top: 4px; }
input[type=text], input[type=password], input[type=number], input[type=search],
input[type=date], input[type=datetime-local], select, textarea {
  width: 100%; padding: 10px 12px; font-family: inherit; font-size: 15px;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--ink); min-height: 42px;
}
textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--brand-soft);
}
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > * { flex: 1; min-width: 140px; }

/* ---------------- ป้ายสถานะ ---------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 20px; font-size: 12.5px; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.badge-merit   { background: var(--brand-soft); color: var(--brand); }
.badge-demerit { background: #fdeee7; color: #a8410f; }
.badge-good    { background: var(--good-soft); color: #056b05; }
.badge-warn    { background: var(--warn-soft); color: #8a6100; }
.badge-serious { background: #fdeee7; color: #a8410f; }
.badge-crit    { background: var(--crit-soft); color: #9c2020; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .badge-demerit { background: #2e1c13; color: #f0a17c; }
  :root:not([data-theme="light"]) .badge-good    { color: #6ede6e; }
  :root:not([data-theme="light"]) .badge-warn    { color: #f5cd6b; }
  :root:not([data-theme="light"]) .badge-serious { background: #2e1c13; color: #f0a17c; }
  :root:not([data-theme="light"]) .badge-crit    { color: #f08a8a; }
}

/* ---------------- ตาราง ---------------- */
.table-wrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
table.data th {
  text-align: left; font-size: 12.5px; color: var(--ink-2); font-weight: 600;
  padding: 9px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap;
}
table.data td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
.clickable { cursor: pointer; }

/* ---------------- รายการอันดับ ---------------- */
.rank-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.rank-item:last-child { border-bottom: none; }
.rank-no {
  width: 28px; height: 28px; flex: 0 0 28px; border-radius: 9px;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  background: var(--surface-2); color: var(--ink-2); font-variant-numeric: tabular-nums;
}
.rank-1 { background: #fdf3dc; color: #8a6100; }
.rank-2 { background: #eeeeea; color: #56554f; }
.rank-3 { background: #f8e7dc; color: #8a4a20; }
.rank-name { flex: 1; min-width: 0; }
.rank-name b { display: block; font-size: 14.5px; font-weight: 600; }
.rank-name span { font-size: 12px; color: var(--muted); }
.rank-score { font-weight: 700; font-size: 16px; color: var(--brand-2); font-variant-numeric: tabular-nums; }
.rank-score small { font-size: 11px; color: var(--muted); font-weight: 400; }

/* ---------------- แถบคะแนน ---------------- */
.meter { height: 8px; background: var(--surface-2); border-radius: 20px; overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 20px; }

/* ---------------- กราฟ ---------------- */
.chart { width: 100%; overflow: visible; display: block; }
.chart-grid { stroke: var(--line); stroke-width: 1; }
.chart-axis { stroke: var(--line-2); stroke-width: 1; }
.chart-label { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-value { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-family: var(--font);
               font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 6px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.legend-swatch { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 11px; }
.tip {
  position: fixed; z-index: 200; pointer-events: none; opacity: 0;
  background: var(--ink); color: var(--bg); padding: 7px 11px; border-radius: 9px;
  font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow-lg);
  transition: opacity .1s; max-width: 240px;
}
.tip b { color: inherit; }

/* ---------------- หน้าเข้าสู่ระบบ ---------------- */
.login-page {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background:
    radial-gradient(900px 500px at 12% -8%, var(--brand-soft), transparent 62%),
    radial-gradient(700px 420px at 105% 108%, var(--brand-soft), transparent 58%),
    var(--bg);
}
.login-card {
  width: 100%; max-width: 400px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px;
  box-shadow: var(--shadow-lg);
}
.login-logo {
  width: 58px; height: 58px; border-radius: 17px; margin: 0 auto 14px;
  background: linear-gradient(140deg, var(--brand-2), var(--brand));
  color: #fff; display: grid; place-items: center; font-size: 27px;
}

/* ---------------- แจ้งเตือน ---------------- */
.alert {
  padding: 11px 14px; border-radius: var(--radius-sm); font-size: 13.5px;
  display: flex; gap: 9px; align-items: flex-start; margin-bottom: 14px;
}
.alert-error { background: var(--crit-soft); color: #9c2020; }
.alert-info  { background: var(--brand-soft); color: var(--brand); }
.alert-warn  { background: var(--warn-soft); color: #8a6100; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .alert-error { color: #f08a8a; }
  :root:not([data-theme="light"]) .alert-warn  { color: #f5cd6b; }
}

.toast-wrap {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: 84px; z-index: 300; display: flex; flex-direction: column;
  gap: 8px; align-items: center; pointer-events: none; width: calc(100% - 32px); max-width: 460px;
}
.toast {
  background: var(--ink); color: var(--bg); padding: 11px 17px; border-radius: 11px;
  font-size: 14px; box-shadow: var(--shadow-lg); animation: rise .22s ease-out;
  display: flex; gap: 9px; align-items: center; width: fit-content; max-width: 100%;
}
.toast.ok   { background: var(--good); color: #fff; }
.toast.err  { background: var(--critical); color: #fff; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------------- Modal ---------------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(11,11,11,.5); z-index: 400;
  display: grid; place-items: center; padding: 18px; overflow-y: auto;
}
.modal {
  background: var(--surface); border-radius: 18px; width: 100%; max-width: 560px;
  box-shadow: var(--shadow-lg); animation: rise .18s ease-out; max-height: 92vh;
  display: flex; flex-direction: column;
}
.modal-head { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.modal-head h3 { font-size: 17px; }
.modal-body { padding: 18px 20px; overflow-y: auto; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 9px; justify-content: flex-end; }

/* ---------------- อื่น ๆ ---------------- */
.empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.empty .big { font-size: 36px; margin-bottom: 8px; opacity: .55; }
.skeleton {
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: sk 1.3s infinite; border-radius: 7px;
}
@keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.spinner {
  width: 17px; height: 17px; border: 2.5px solid rgba(255,255,255,.35);
  border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono  { font-variant-numeric: tabular-nums; }
.hide  { display: none !important; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  padding: 6px 13px; border-radius: 20px; border: 1px solid var(--line-2);
  background: var(--surface); font-size: 13.5px; cursor: pointer; font-family: inherit;
  color: var(--ink-2); min-height: 34px;
}
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }

.kind-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.kind-btn {
  padding: 15px 12px; border-radius: var(--radius); border: 2px solid var(--line);
  background: var(--surface); cursor: pointer; font-family: inherit; text-align: center;
  transition: border-color .12s, background .12s;
}
.kind-btn .emo { font-size: 25px; display: block; margin-bottom: 3px; }
.kind-btn .txt { display: block; font-size: 15px; font-weight: 700; color: var(--ink); }
.kind-btn .sub { display: block; font-size: 11.5px; color: var(--muted); }
.kind-btn.on.merit   { border-color: var(--series-1); background: var(--brand-soft); }
.kind-btn.on.demerit { border-color: var(--series-2); background: #fdeee7; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .kind-btn.on.demerit { background: #2e1c13; }
}

.pick-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.pick-item {
  padding: 11px 13px; border-bottom: 1px solid var(--line); cursor: pointer;
  display: flex; align-items: center; gap: 11px;
}
.pick-item:last-child { border-bottom: none; }
.pick-item:hover { background: var(--surface-2); }
.pick-item.on { background: var(--brand-soft); }
.pick-item .grow { flex: 1; min-width: 0; }
.pick-item b { font-size: 14.5px; font-weight: 600; display: block; }
.pick-item span { font-size: 12px; color: var(--muted); }
.pick-pts { font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }

/* ---------------- มือถือและแท็บเล็ต ---------------- */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .content { padding: 16px 14px 96px; }
  .topbar { padding: 12px 14px; }
  .topbar h1 { font-size: 17px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .span-2 { grid-column: span 1; }
  .card { padding: 15px; }
  .table-wrap { margin: 0 -15px; padding: 0 15px; }
  .stat .value { font-size: 26px; }

  .mobile-bar {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .mobile-bar button {
    flex: 1; border: none; background: none; font-family: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 2px; color: var(--muted); font-size: 10.5px; border-radius: 10px;
    position: relative; min-width: 0;
  }
  .mobile-bar button .ico { font-size: 20px; line-height: 1; }
  .mobile-bar button.active { color: var(--brand-2); font-weight: 700; }
  .mobile-bar .dot {
    position: absolute; top: 3px; right: 50%; margin-right: -18px;
    background: var(--critical); color: #fff; font-size: 9.5px; font-weight: 700;
    min-width: 16px; height: 16px; border-radius: 10px; padding: 0 4px;
    display: grid; place-items: center;
  }
  .modal { max-width: 100%; border-radius: 18px 18px 0 0; margin-top: auto; max-height: 94vh; }
  .modal-back { padding: 0; align-items: end; }
  .toast-wrap { bottom: 96px; }
}

@media (max-width: 420px) {

<script>
/* ==================================================================
   แกนหลักของหน้าเว็บ: สถานะ การเรียก API เราเตอร์ และส่วนประกอบร่วม
   ================================================================== */

var S = {
  token: null,
  user: null,
  perm: {},
  app: {},
  view: 'dashboard',
  cache: {},
  pendingCount: 0
};

var TOKEN_KEY = 'scss_token';

/* ---------------- เรียก API ---------------- */

/**
 * เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์ คืน Promise
 * ฟังก์ชันฝั่งเซิร์ฟเวอร์ทุกตัวคืน { ok, data } หรือ { ok:false, error }
 * เซสชันหมดอายุจะพากลับหน้าเข้าสู่ระบบให้อัตโนมัติ
 */
function call(fn, args) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (res && res.ok) return resolve(res.data);
        var msg = (res && res.error) || 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ';
        if (msg.indexOf('เซสชันหมดอายุ') >= 0) {
          clearToken();
          renderLogin('เซสชันหมดอายุ กรุณาเข้าสู่ระบบอีกครั้ง');
        }
        reject(new Error(msg));
      })
      .withFailureHandler(function (err) {
        reject(new Error(err && err.message ? err.message : 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ'));
      })[fn].apply(null, args || []);
  });
}

function saveToken(t) {
  S.token = t;
  try { localStorage.setItem(TOKEN_KEY, t); } catch (e) { /* โหมดส่วนตัวของเบราว์เซอร์ */ }
}
function loadToken() {
  try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
}
function clearToken() {
  S.token = null; S.user = null;
  try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
}

/* ---------------- ตัวช่วยทั่วไป ---------------- */

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function el(id) { return document.getElementById(id); }
function num(v) { return Number(v || 0).toLocaleString('th-TH'); }
function initials(name) {
  var s = String(name || '?').replace(/^(นาย|นาง|นางสาว|เด็กชาย|เด็กหญิง|ด\.ช\.|ด\.ญ\.)/, '').trim();
  return s.charAt(0) || '?';
}

function toast(message, kind) {
  var wrap = el('toasts');
  var t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.innerHTML = (kind === 'ok' ? '✓ ' : kind === 'err' ? '⚠ ' : '') + esc(message);
  wrap.appendChild(t);
  setTimeout(function () {
    t.style.transition = 'opacity .25s'; t.style.opacity = '0';
    setTimeout(function () { t.remove(); }, 260);
  }, kind === 'err' ? 5200 : 3000);
}

function openModal(title, bodyHtml, footHtml) {
  el('modal-root').innerHTML =
    '<div class="modal-back" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
          '<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="closeModal()">✕</button></div>' +
        '<div class="modal-body">' + bodyHtml + '</div>' +
        (footHtml ? '<div class="modal-foot">' + footHtml + '</div>' : '') +
      '</div></div>';
}
function closeModal() { el('modal-root').innerHTML = ''; }

function confirmAction(title, message, onYes, danger) {
  openModal(title, '<p>' + esc(message) + '</p>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-yes">ยืนยัน</button>');
  el('cf-yes').onclick = function () { closeModal(); onYes(); };
}

function busy(button, isBusy, labelWhenDone) {
  if (!button) return;
  if (isBusy) {
    button.dataset.label = button.innerHTML;
    button.disabled = true;
    button.innerHTML = '<span class="spinner"></span> กำลังทำงาน...';
  } else {
    button.disabled = false;
    button.innerHTML = labelWhenDone || button.dataset.label || 'ตกลง';
  }
}

function riskBadge(level) {
  var map = { 'ปกติ': 'badge-good', 'เฝ้าระวัง': 'badge-warn', 'เสี่ยง': 'badge-serious', 'วิกฤต': 'badge-crit' };
  var icon = { 'ปกติ': '●', 'เฝ้าระวัง': '▲', 'เสี่ยง': '▲', 'วิกฤต': '■' };
  return '<span class="badge ' + (map[level] || '') + '">' + (icon[level] || '') + ' ' + esc(level) + '</span>';
}

function scoreColor(score) {
  if (score >= 91) return 'var(--good)';
  if (score >= 71) return 'var(--warning)';
  if (score >= 51) return 'var(--serious)';
  return 'var(--critical)';
}

function statusBadge(status) {
  var map = {
    'รออนุมัติ': 'badge-warn', 'อนุมัติแล้ว': 'badge-good',
    'ไม่อนุมัติ': 'badge-crit', 'เพิกถอน': 'badge'
  };
  return '<span class="badge ' + (map[status] || '') + '">' + esc(status) + '</span>';
}

/* ---------------- เมนู ---------------- */

var MENU = [
  { id: 'dashboard', icon: '📊', label: 'แดชบอร์ด',      perm: null },
  { id: 'record',    icon: '✏️', label: 'บันทึกพฤติกรรม', perm: 'record.create' },
  { id: 'approve',   icon: '✅', label: 'รออนุมัติ',      perm: 'record.approve', badge: true },
  { id: 'students',  icon: '👥', label: 'นักเรียน',       perm: 'student.view' },
  { id: 'board',     icon: '🏅', label: 'กระดานเกียรติยศ', perm: null },
  { id: 'reports',   icon: '📄', label: 'รายงาน',         perm: 'report.view' },
  { id: 'admin',     icon: '⚙️', label: 'ตั้งค่าระบบ',     perm: 'settings.manage' }
];

function visibleMenu() {
  return MENU.filter(function (m) { return !m.perm || S.perm[m.perm]; });
}

/* เมนูล่างบนมือถือแสดงได้ 5 ช่อง ที่เหลือรวมใน "เพิ่มเติม" */
function mobileMenu() {
  var items = visibleMenu();
  if (items.length <= 5) return items;
  return items.slice(0, 4).concat([{ id: '__more', icon: '⋯', label: 'เพิ่มเติม' }]);
}

/* ---------------- โครงหน้า ---------------- */

function renderShell() {
  var menu = visibleMenu();
  var mob = mobileMenu();

  el('root').innerHTML =
    '<div class="app">' +
      '<nav class="sidebar">' +
        '<div class="brand">' +
          '<div class="brand-mark">🎓</div>' +
          '<div class="brand-text"><b>คะแนนความประพฤติ</b><span>' + esc(S.app.school || '') + '</span></div>' +
        '</div>' +
        menu.map(function (m) {
          return '<button class="navlink" data-nav="' + m.id + '" onclick="go(\'' + m.id + '\')">' +
            '<span class="ico">' + m.icon + '</span>' + esc(m.label) +
            (m.badge ? '<span class="pill hide" data-pending></span>' : '') + '</button>';
        }).join('') +
        '<div class="nav-sep"></div>' +
        '<button class="navlink" onclick="openChangePassword()"><span class="ico">🔑</span>เปลี่ยนรหัสผ่าน</button>' +
        '<button class="navlink" onclick="doLogout()"><span class="ico">🚪</span>ออกจากระบบ</button>' +
        '<div class="nav-foot">ปีการศึกษา ' + esc(S.app.year) + ' ภาคเรียนที่ ' + esc(S.app.term) +
          '<br>เวอร์ชัน ' + esc(S.app.version) + '</div>' +
      '</nav>' +

      '<div class="main">' +
        '<header class="topbar">' +
          '<div><h1 id="page-title">แดชบอร์ด</h1>' +
            '<div class="sub" id="page-sub">ปีการศึกษา ' + esc(S.app.year) +
            ' ภาคเรียนที่ ' + esc(S.app.term) + '</div></div>' +
          '<div class="topbar-right">' +
            '<div class="who"><b>' + esc(S.user.name) + '</b><span>' + esc(S.user.roleName) + '</span></div>' +
            '<div class="avatar">' + esc(initials(S.user.name)) + '</div>' +
          '</div>' +
        '</header>' +
        '<main class="content" id="content"></main>' +
      '</div>' +
    '</div>' +

    '<nav class="mobile-bar">' +
      mob.map(function (m) {
        return '<button data-nav="' + m.id + '" onclick="' +
          (m.id === '__more' ? 'openMoreMenu()' : 'go(\'' + m.id + '\')') + '">' +
          '<span class="ico">' + m.icon + '</span>' + esc(m.label) +
          (m.badge ? '<span class="dot hide" data-pending></span>' : '') + '</button>';
      }).join('') +
    '</nav>';
}

function openMoreMenu() {
  var shown = mobileMenu().map(function (m) { return m.id; });
  var rest = visibleMenu().filter(function (m) { return shown.indexOf(m.id) < 0; });
  openModal('เมนูเพิ่มเติม',
    '<div class="pick-list">' +
      rest.map(function (m) {
        return '<div class="pick-item" onclick="closeModal();go(\'' + m.id + '\')">' +
          '<span style="font-size:19px">' + m.icon + '</span><div class="grow"><b>' + esc(m.label) + '</b></div></div>';
      }).join('') +
      '<div class="pick-item" onclick="closeModal();openChangePassword()">' +
        '<span style="font-size:19px">🔑</span><div class="grow"><b>เปลี่ยนรหัสผ่าน</b></div></div>' +
      '<div class="pick-item" onclick="closeModal();doLogout()">' +
        '<span style="font-size:19px">🚪</span><div class="grow"><b>ออกจากระบบ</b></div></div>' +
    '</div>');
}

function setActiveNav(view) {
  $$('[data-nav]').forEach(function (n) {
    n.classList.toggle('active', n.getAttribute('data-nav') === view);
  });
}

function updatePendingBadge(count) {
  S.pendingCount = count;
  $$('[data-pending]').forEach(function (b) {
    b.textContent = count > 99 ? '99+' : count;
    b.classList.toggle('hide', !count);
  });
}

var VIEWS = {};   // ลงทะเบียนไว้ใน ScriptViews.html

function go(view) {
  if (!VIEWS[view]) view = 'dashboard';
  S.view = view;
  setActiveNav(view);
  var meta = MENU.filter(function (m) { return m.id === view; })[0];
  if (meta) el('page-title').textContent = meta.label;
  var content = el('content');
  content.innerHTML = '<div class="grid grid-2">' +
    '<div class="card"><div class="skeleton" style="height:100px"></div></div>' +
    '<div class="card"><div class="skeleton" style="height:100px"></div></div></div>';
  window.scrollTo(0, 0);

  Promise.resolve(VIEWS[view](content)).catch(function (e) {
    content.innerHTML = '<div class="card"><div class="alert alert-error">⚠ ' + esc(e.message) + '</div>' +
      '<button class="btn" onclick="go(\'' + view + '\')">ลองใหม่</button></div>';
  });
}

/* ---------------- เข้าสู่ระบบ ---------------- */

function renderLogin(message) {
  el('root').innerHTML =
    '<div class="login-page"><div class="login-card">' +
      '<div class="login-logo">🎓</div>' +
      '<h2 style="text-align:center;font-size:19px">ระบบคะแนนความประพฤตินักเรียน</h2>' +
      '<p style="text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:20px">โรงเรียนจุนวิทยาคม</p>' +
      (message ? '<div class="alert alert-warn">⚠ ' + esc(message) + '</div>' : '') +
      '<div id="login-error"></div>' +
      '<form id="login-form" autocomplete="on">' +
        '<div class="field"><label for="lg-user">ชื่อผู้ใช้</label>' +
          '<input id="lg-user" type="text" autocomplete="username" autocapitalize="none" ' +
          'spellcheck="false" required placeholder="เช่น kru.somchai"></div>' +
        '<div class="field"><label for="lg-pass">รหัสผ่าน</label>' +
          '<input id="lg-pass" type="password" autocomplete="current-password" required></div>' +
        '<button class="btn btn-primary btn-block" type="submit" id="lg-btn" style="margin-top:6px">เข้าสู่ระบบ</button>' +
      '</form>' +
      '<div class="divider"></div>' +
      '<button class="btn btn-ghost btn-block btn-sm" onclick="renderPublicBoard()">' +
        '🏅 ดูกระดานเกียรติยศ (ไม่ต้องเข้าสู่ระบบ)</button>' +
    '</div></div>';

  el('login-form').onsubmit = function (ev) {
    ev.preventDefault();
    var btn = el('lg-btn');
    el('login-error').innerHTML = '';
    busy(btn, true);
    call('apiLogin', [el('lg-user').value, el('lg-pass').value])
      .then(function (res) {
        saveToken(res.token);
        S.user = res.user; S.perm = res.permissions; S.app = res.app;
        renderShell();
        go('dashboard');
        if (res.user.mustChangePassword) {
          setTimeout(function () { openChangePassword(true); }, 400);
        }
      })
      .catch(function (e) {
        busy(btn, false, 'เข้าสู่ระบบ');
        el('login-error').innerHTML = '<div class="alert alert-error">⚠ ' + esc(e.message) + '</div>';
      });
  };
  setTimeout(function () { var u = el('lg-user'); if (u) u.focus(); }, 60);
}

function doLogout() {
  confirmAction('ออกจากระบบ', 'ต้องการออกจากระบบใช่หรือไม่', function () {
    var t = S.token;
    clearToken();
    renderLogin();
    call('apiLogout', [t]).catch(function () {});
  });
}

function openChangePassword(forced) {
  openModal('เปลี่ยนรหัสผ่าน',
    (forced ? '<div class="alert alert-warn">⚠ นี่เป็นการเข้าใช้ครั้งแรก กรุณาตั้งรหัสผ่านใหม่ก่อนใช้งาน</div>' : '') +
    '<div id="cp-error"></div>' +
    '<div class="field"><label>รหัสผ่านเดิม</label><input id="cp-old" type="password" autocomplete="current-password"></div>' +
    '<div class="field"><label>รหัสผ่านใหม่</label><input id="cp-new" type="password" autocomplete="new-password">' +
      '<div class="help">อย่างน้อย 8 ตัวอักษร ควรผสมตัวอักษรและตัวเลข</div></div>' +
    '<div class="field"><label>ยืนยันรหัสผ่านใหม่</label><input id="cp-new2" type="password" autocomplete="new-password"></div>',
    '<button class="btn" onclick="closeModal()">ปิด</button>' +
    '<button class="btn btn-primary" id="cp-save">บันทึก</button>');

  el('cp-save').onclick = function () {
    var a = el('cp-new').value, b = el('cp-new2').value;
    if (a !== b) {
      el('cp-error').innerHTML = '<div class="alert alert-error">⚠ รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน</div>';
      return;
    }
    var btn = this;
    busy(btn, true);
    call('apiChangePassword', [S.token, el('cp-old').value, a])
      .then(function () { closeModal(); toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok'); })
      .catch(function (e) {
        busy(btn, false, 'บันทึก');
        el('cp-error').innerHTML = '<div class="alert alert-error">⚠ ' + esc(e.message) + '</div>';
      });
  };
}

/* ---------------- เริ่มทำงาน ---------------- */

function boot() {
  if (PUBLIC_MODE) { renderPublicBoard(); return; }

  var t = loadToken();
  if (!t) { renderLogin(); return; }

  S.token = t;
  call('apiMe', [t])
    .then(function (res) {
      S.user = res.user; S.perm = res.permissions; S.app = res.app;
      renderShell();
      go('dashboard');
    })
    .catch(function () { clearToken(); renderLogin(); });
}
</script>

<script>
/* ==================================================================
   กราฟทั้งหมดวาดด้วย SVG ที่เขียนเอง ไม่ต้องโหลดไลบรารีภายนอก
   โรงเรียนที่อินเทอร์เน็ตช้าจึงเปิดใช้ได้ และไม่มีข้อมูลรั่วออกนอกระบบ

   หลักที่ยึด: เส้นบาง เส้นกริดจาง ป้ายกำกับเฉพาะจุดที่จำเป็น
   มีคำอธิบายสัญลักษณ์เมื่อมีตั้งแต่ 2 ชุดข้อมูลขึ้นไป และดูเป็นตารางได้
   ================================================================== */

var CHART_REGISTRY = [];

function registerChart(fn) {
  CHART_REGISTRY.push(fn);
  fn();
}
function clearCharts() { CHART_REGISTRY = []; }

var _resizeTimer;
window.addEventListener('resize', function () {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(function () {
    CHART_REGISTRY.forEach(function (fn) { try { fn(); } catch (e) {} });
  }, 180);
});

function showTip(html, x, y) {
  var tip = el('tip');
  tip.innerHTML = html;
  tip.style.opacity = '1';
  var w = tip.offsetWidth, h = tip.offsetHeight;
  var left = Math.min(Math.max(8, x - w / 2), window.innerWidth - w - 8);
  var top = y - h - 12;
  if (top < 8) top = y + 18;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTip() { el('tip').style.opacity = '0'; }

/* ------------------------------------------------------------------ */
/* กราฟเส้น: เปรียบเทียบความดีกับความผิดรายเดือน                          */
/* ------------------------------------------------------------------ */

function lineChart(containerId, points, series) {
  var box = el(containerId);
  if (!box) return;
  var W = Math.max(box.clientWidth || 320, 280);
  var H = 230;
  var pad = { t: 18, r: 46, b: 30, l: 34 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;

  var maxVal = 1;
  series.forEach(function (s) {
    points.forEach(function (p) { maxVal = Math.max(maxVal, Number(p[s.key]) || 0); });
  });
  maxVal = Math.ceil(maxVal * 1.15 / 5) * 5 || 5;

  function px(i) { return pad.l + (points.length === 1 ? iw / 2 : i * iw / (points.length - 1)); }
  function py(v) { return pad.t + ih - (Number(v) || 0) / maxVal * ih; }

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
            '" role="img" aria-label="แนวโน้มรายเดือน">';

  // เส้นกริดแนวนอน 4 ระดับ — จางกว่าข้อมูลเสมอ
  for (var g = 0; g <= 4; g++) {
    var v = maxVal * g / 4, y = py(v);
    svg += '<line class="chart-grid" x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '"/>';
    svg += '<text class="chart-label" x="' + (pad.l - 7) + '" y="' + (y + 3.5) +
           '" text-anchor="end">' + Math.round(v) + '</text>';
  }
  svg += '<line class="chart-axis" x1="' + pad.l + '" y1="' + (pad.t + ih) + '" x2="' + (W - pad.r) +
         '" y2="' + (pad.t + ih) + '"/>';

  points.forEach(function (p, i) {
    svg += '<text class="chart-label" x="' + px(i) + '" y="' + (H - 9) + '" text-anchor="middle">' +
           esc(p.label) + '</text>';
  });

  series.forEach(function (s) {
    var d = points.map(function (p, i) { return (i ? 'L' : 'M') + px(i) + ' ' + py(p[s.key]); }).join(' ');
    svg += '<path d="' + d + '" fill="none" stroke="' + s.color +
           '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    points.forEach(function (p, i) {
      // วงแหวนสีพื้นหลัง 2px กันจุดสองชุดทับกันจนแยกไม่ออก
      svg += '<circle cx="' + px(i) + '" cy="' + py(p[s.key]) + '" r="4" fill="' + s.color +
             '" stroke="var(--surface)" stroke-width="2"/>';
    });
    // ป้ายกำกับที่จุดสุดท้ายเท่านั้น ไม่ใส่ตัวเลขทุกจุด
    var last = points.length - 1;
    svg += '<text class="chart-value" x="' + (px(last) + 9) + '" y="' + (py(points[last][s.key]) + 4) +
           '" fill="' + s.color + '">' + esc(s.label) + '</text>';
  });

  // พื้นที่รับเมาส์รายเดือน ใหญ่กว่าจุดข้อมูลเพื่อให้แตะง่ายบนมือถือ
  points.forEach(function (p, i) {
    var half = points.length > 1 ? iw / (points.length - 1) / 2 : iw / 2;
    svg += '<rect x="' + (px(i) - half) + '" y="' + pad.t + '" width="' + (half * 2) + '" height="' + ih +
           '" fill="transparent" data-hover="' + i + '" style="cursor:pointer"/>';
  });
  svg += '<line id="' + containerId + '-cross" class="chart-axis" y1="' + pad.t + '" y2="' + (pad.t + ih) +
         '" x1="-10" x2="-10" stroke-dasharray="3 3" opacity="0"/></svg>';

  box.innerHTML =
    '<div class="legend">' + series.map(function (s) {
      return '<span class="legend-item"><span class="legend-swatch" style="background:' + s.color + '"></span>' +
             esc(s.label) + '</span>';
    }).join('') + '</div>' + svg;

  var cross = el(containerId + '-cross');
  $$('[data-hover]', box).forEach(function (r) {
    var i = Number(r.getAttribute('data-hover'));
    function show(ev) {
      var rect = r.getBoundingClientRect();
      cross.setAttribute('x1', px(i)); cross.setAttribute('x2', px(i));
      cross.setAttribute('opacity', '.5');
      showTip('<b>' + esc(points[i].label) + '</b><br>' + series.map(function (s) {
        return '<span style="color:' + s.color + '">●</span> ' + esc(s.label) + ' ' + (points[i][s.key] || 0) + ' ครั้ง';
      }).join('<br>'), rect.left + rect.width / 2, rect.top + 30);
    }
    r.addEventListener('mouseenter', show);
    r.addEventListener('mousemove', show);
    r.addEventListener('touchstart', show, { passive: true });
    r.addEventListener('mouseleave', function () { cross.setAttribute('opacity', '0'); hideTip(); });
  });
}

/* ------------------------------------------------------------------ */
/* กราฟแท่งแนวนอน: ใช้กับพฤติกรรมที่พบบ่อย (ชุดข้อมูลเดียว จึงไม่ต้องมีคำอธิบายสี) */
/* ------------------------------------------------------------------ */

function barChartH(containerId, items, opts) {
  var box = el(containerId);
  if (!box) return;
  opts = opts || {};
  if (!items.length) {
    box.innerHTML = '<div class="empty"><div class="big">📭</div>ยังไม่มีข้อมูลในช่วงนี้</div>';
    return;
  }
  var color = opts.color || 'var(--series-1)';
  var max = Math.max.apply(null, items.map(function (i) { return i.count; })) || 1;

  box.innerHTML = items.map(function (i) {
    var pct = Math.round(i.count / max * 100);
    return '<div style="margin-bottom:11px" title="' + esc(i.name) + ' ' + i.count + ' ครั้ง">' +
      '<div style="display:flex;gap:10px;align-items:baseline;margin-bottom:4px">' +
        '<span style="font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
          esc(i.name) + '</span>' +
        '<b class="mono" style="font-size:14px">' + i.count + '</b>' +
        '<span class="small muted">ครั้ง</span>' +
      '</div>' +
      '<div class="meter"><i style="width:' + pct + '%;background:' + color + '"></i></div>' +
    '</div>';
  }).join('');
}

/* ------------------------------------------------------------------ */
/* กราฟแท่งแนวตั้ง: คะแนนเฉลี่ยรายระดับชั้น                                */
/* ------------------------------------------------------------------ */

function barChartV(containerId, items, opts) {
  var box = el(containerId);
  if (!box) return;
  opts = opts || {};
  if (!items.length) { box.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }

  var W = Math.max(box.clientWidth || 320, 260);
  var H = 210;
  var pad = { t: 22, r: 8, b: 40, l: 34 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  var min = opts.min !== undefined ? opts.min : 0;
  var max = opts.max !== undefined ? opts.max : Math.max.apply(null, items.map(function (i) { return i.value; }));
  if (max === min) max = min + 1;

  var slot = iw / items.length;
  var barW = Math.min(slot - 12, 62);

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
            '" role="img" aria-label="' + esc(opts.aria || 'กราฟแท่ง') + '">';

  for (var g = 0; g <= 3; g++) {
    var v = min + (max - min) * g / 3;
    var y = pad.t + ih - (v - min) / (max - min) * ih;
    svg += '<line class="chart-grid" x1="' + pad.l + '" y1="' + y + '" x2="' + (W - pad.r) + '" y2="' + y + '"/>' +
           '<text class="chart-label" x="' + (pad.l - 7) + '" y="' + (y + 3.5) + '" text-anchor="end">' +
           Math.round(v) + '</text>';
  }

  items.forEach(function (it, i) {
    var h = Math.max(3, (it.value - min) / (max - min) * ih);
    var x = pad.l + slot * i + (slot - barW) / 2;
    var y = pad.t + ih - h;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + barW + '" height="' + h +
           '" rx="4" fill="' + (opts.color || 'var(--series-1)') + '" data-bar="' + i + '" style="cursor:pointer"/>' +
           '<text class="chart-value" x="' + (x + barW / 2) + '" y="' + (y - 6) + '" text-anchor="middle">' +
           it.value + '</text>' +
           '<text class="chart-label" x="' + (x + barW / 2) + '" y="' + (H - 22) + '" text-anchor="middle">' +
           esc(it.label) + '</text>' +
           (it.n !== undefined ? '<text class="chart-label" x="' + (x + barW / 2) + '" y="' + (H - 8) +
             '" text-anchor="middle" opacity=".75">' + it.n + ' คน</text>' : '');
  });
  svg += '</svg>';
  box.innerHTML = svg;

  $$('[data-bar]', box).forEach(function (r) {
    var it = items[Number(r.getAttribute('data-bar'))];
    r.addEventListener('mouseenter', function () {
      var b = r.getBoundingClientRect();
      showTip('<b>' + esc(it.label) + '</b><br>' + esc(opts.valueLabel || 'ค่า') + ' ' + it.value +
        (it.n !== undefined ? '<br>นักเรียน ' + it.n + ' คน' : ''), b.left + b.width / 2, b.top);
    });
    r.addEventListener('mouseleave', hideTip);
  });
}

/* ------------------------------------------------------------------ */
/* แถบสัดส่วน: การกระจายตามระดับความเสี่ยง                                */
/* ใช้สีสถานะประจำระบบ และมีทั้งไอคอนและตัวอักษรกำกับเสมอ ไม่พึ่งสีอย่างเดียว */
/* ------------------------------------------------------------------ */

function segmentBar(containerId, segments) {
  var box = el(containerId);
  if (!box) return;
  var total = segments.reduce(function (a, s) { return a + s.value; }, 0);
  if (!total) { box.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'; return; }

  box.innerHTML =
    '<div style="display:flex;height:15px;border-radius:20px;overflow:hidden;gap:2px;margin-bottom:14px">' +
      segments.filter(function (s) { return s.value > 0; }).map(function (s) {
        return '<div style="width:' + (s.value / total * 100) + '%;background:' + s.color + '" ' +
               'title="' + esc(s.label) + ' ' + s.value + ' คน"></div>';
      }).join('') +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">' +
      segments.map(function (s) {
        return '<div style="display:flex;align-items:center;gap:8px">' +
          '<span style="width:10px;height:10px;border-radius:3px;background:' + s.color + ';flex:0 0 10px"></span>' +
          '<span style="font-size:13px;flex:1">' + esc(s.icon || '') + ' ' + esc(s.label) + '</span>' +
          '<b class="mono" style="font-size:14px">' + s.value + '</b>' +
          '<span class="small muted">' + Math.round(s.value / total * 100) + '%</span>' +
        '</div>';
      }).join('') +
    '</div>';
}

/* ------------------------------------------------------------------ */
/* กราฟเส้นเล็กสำหรับหน้าประวัตินักเรียน                                    */
/* ------------------------------------------------------------------ */

function sparkScore(containerId, timeline, startScore) {
  var box = el(containerId);
  if (!box) return;
  var pts = [{ date: 'เริ่มต้น', score: startScore }].concat(timeline);
  if (pts.length < 2) {
    box.innerHTML = '<div class="empty small">ยังไม่มีการเปลี่ยนแปลงคะแนนในปีการศึกษานี้</div>';
    return;
  }

  var W = Math.max(box.clientWidth || 320, 260), H = 130;
  var pad = { t: 14, r: 12, b: 20, l: 30 };
  var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  // ช่วงแกนตั้งปรับตามคะแนนจริง ถ้าคะแนนยังสูงอยู่จะซูมให้เห็นการเปลี่ยนแปลงเล็กน้อยได้
  var lowest = Math.min.apply(null, pts.map(function (p) { return p.score; }));
  var max = 100, min = Math.max(0, Math.floor((lowest - 10) / 10) * 10);
  if (max - min < 20) min = Math.max(0, max - 20);

  function px(i) { return pad.l + i * iw / (pts.length - 1); }
  function py(v) { return pad.t + ih - (v - min) / (max - min) * ih; }

  var d = pts.map(function (p, i) { return (i ? 'L' : 'M') + px(i) + ' ' + py(p.score); }).join(' ');
  var area = d + ' L' + px(pts.length - 1) + ' ' + (pad.t + ih) + ' L' + px(0) + ' ' + (pad.t + ih) + ' Z';

  var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">';
  [min, Math.round((min + max) / 2), max].forEach(function (v) {
    svg += '<line class="chart-grid" x1="' + pad.l + '" y1="' + py(v) + '" x2="' + (W - pad.r) + '" y2="' + py(v) + '"/>' +
           '<text class="chart-label" x="' + (pad.l - 6) + '" y="' + (py(v) + 3.5) + '" text-anchor="end">' + v + '</text>';
  });
  svg += '<path d="' + area + '" fill="var(--brand-2)" opacity=".1"/>' +
         '<path d="' + d + '" fill="none" stroke="var(--brand-2)" stroke-width="2" stroke-linejoin="round"/>';
  pts.forEach(function (p, i) {
    svg += '<circle cx="' + px(i) + '" cy="' + py(p.score) + '" r="3.5" fill="var(--brand-2)" ' +
           'stroke="var(--surface)" stroke-width="2" data-sp="' + i + '" style="cursor:pointer"/>';
  });
  var lastPt = pts[pts.length - 1];
  svg += '<text class="chart-value" x="' + (px(pts.length - 1)) + '" y="' + (py(lastPt.score) - 9) +
         '" text-anchor="end">' + lastPt.score + '</text></svg>';
  box.innerHTML = svg;

  $$('[data-sp]', box).forEach(function (c) {
    var p = pts[Number(c.getAttribute('data-sp'))];
    c.addEventListener('mouseenter', function () {
      var b = c.getBoundingClientRect();
      showTip('<b>' + esc(p.date) + '</b><br>คะแนนคงเหลือ ' + p.score, b.left + b.width / 2, b.top);
    });
    c.addEventListener('mouseleave', hideTip);
  });
}
</script>

function statCard(icon, label, value, unit, foot, color) {
  return '<div class="card"><div class="stat">' +
    '<div class="label"><span class="stat-icon">' + icon + '</span>' + esc(label) + '</div>' +
    '<div class="value"' + (color ? ' style="color:' + color + '"' : '') + '>' + esc(value) +
      ' <span class="unit">' + esc(unit) + '</span></div>' +
    '<div class="foot">' + esc(foot) + '</div>' +
  '</div></div>';
}

function rankList(items) {
  if (!items.length) {
    return '<div class="empty small" style="padding:16px">ยังไม่มีนักเรียนที่เข้าเกณฑ์ในระดับนี้</div>';
  }
  return items.map(function (c) {
    return '<div class="rank-item">' +
      '<div class="rank-no rank-' + c.rank + '">' + c.rank + '</div>' +
      '<div class="rank-name"><b>' + esc(c.displayName) + '</b><span>' + esc(c.classLabel) + '</span></div>' +
      '<div class="rank-score">' + c.meritTotal + ' <small>คะแนน</small></div>' +
    '</div>';
  }).join('');
}

function toggleTrendTable() {
  var t = el('trend-table'), c = el('chart-trend'), btn = el('trend-toggle');
  var showTable = t.classList.contains('hide');
  if (showTable && !t.innerHTML) {
    t.innerHTML = '<div class="table-wrap"><table class="data"><thead><tr>' +
      '<th>เดือน</th><th class="num">ความดี (ครั้ง)</th><th class="num">ความผิด (ครั้ง)</th>' +

               '</td><td class="num">' + m.demerit + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  t.classList.toggle('hide', !showTable);
  c.classList.toggle('hide', showTable);
  btn.textContent = showTable ? 'ดูเป็นกราฟ' : 'ดูเป็นตาราง';
}

            'oninput="renderRules()" style="margin-bottom:8px">' +
          '<div class="pick-list" id="rule-list"></div></div>' +

        '<div class="field"><label for="rec-detail">3. รายละเอียดเหตุการณ์ <span class="muted">(จำเป็น)</span></label>' +
          '<textarea id="rec-detail" placeholder="เกิดอะไรขึ้น ที่ไหน อย่างไร เขียนตามจริงอย่างเป็นกลาง"></textarea>' +
          '<div class="help">รายละเอียดที่ดีช่วยให้เห็นสาเหตุเชิงระบบ เช่น มาสายเพราะรถรับส่ง ไม่ใช่เพราะขาดวินัย</div></div>' +

        '<div class="row">' +
          '<div class="field"><label for="rec-place">สถานที่</label>' +
            '<input type="text" id="rec-place" placeholder="เช่น หน้าเสาธง โรงอาหาร"></div>' +
          '<div class="field"><label for="rec-when">วันเวลาที่เกิดเหตุ</label>' +
            '<input type="datetime-local" id="rec-when"></div>' +
        '</div>' +

        '<div class="field hide" id="evidence-field"><label for="rec-evidence">ลิงก์หลักฐาน ' +
          '<span class="muted">(เกณฑ์นี้บังคับ)</span></label>' +
          '<input type="text" id="rec-evidence" placeholder="วางลิงก์รูปภาพจาก Google Drive หรือ Google Photos">' +
          '<div class="help">อัปโหลดไฟล์ขึ้น Google Drive ของโรงเรียนแล้วนำลิงก์มาวาง</div></div>' +

        '<button class="btn btn-primary btn-block" id="rec-submit" onclick="submitRecord(this)" ' +
          'style="margin-top:6px">บันทึกและส่งให้พิจารณา</button>' +
        '<p class="small muted" style="margin-top:10px">บันทึกจะมีผลต่อคะแนนเมื่อผู้มีอำนาจอนุมัติแล้วเท่านั้น</p>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-head"><h3>บันทึกล่าสุดของฉัน</h3>' +
          '<div class="right"><button class="btn btn-ghost btn-sm" onclick="loadMyRecords()">รีเฟรช</button></div></div>' +
        '<div id="my-records"><div class="skeleton" style="height:120px"></div></div>' +
      '</div>' +
    '</div>';

  var now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  el('rec-when').value = now.toISOString().slice(0, 16);

  REC.student = null; REC.rule = null;
  renderStudentPicker();
  loadMyRecords();

  return call('apiListRules', [S.token]).then(function (rules) {
    REC.rules = rules;
    renderRules();
  });
};

function setKind(kind) {
  REC.kind = kind;
  REC.rule = null;
  el('k-merit').classList.toggle('on', kind === 'ความดี');
  el('k-demerit').classList.toggle('on', kind === 'ความผิด');
  el('evidence-field').classList.add('hide');
  renderRules();
}

function renderRules() {
  if (!REC.rules) return;
  var q = (el('rule-search').value || '').trim().toLowerCase();
  var list = REC.rules.filter(function (r) {
    if (r.kind !== REC.kind) return false;
    if (!q) return true;
    return (r.code + ' ' + r.name + ' ' + r.category).toLowerCase().indexOf(q) >= 0;
  });

  if (!list.length) {
    el('rule-list').innerHTML = '<div class="empty small">ไม่พบหลักเกณฑ์ที่ค้นหา</div>';
    el('rule-count').textContent = '';
    return;
  }

  // จัดกลุ่มตามหมวดเพื่อให้หาเจอเร็วขึ้น ตอนนี้มีเกณฑ์รวมกันเกือบร้อยข้อ
  var groups = [], seen = {};
  list.forEach(function (r) {
    var cat = r.category || 'ทั่วไป';
    if (!seen[cat]) { seen[cat] = { name: cat, items: [] }; groups.push(seen[cat]); }
    seen[cat].items.push(r);
  });

  el('rule-count').textContent = list.length + ' ข้อ';
  el('rule-list').innerHTML = groups.map(function (g) {
    return '<div style="position:sticky;top:0;z-index:1;background:var(--surface-2);padding:5px 13px;' +
        'font-size:11.5px;font-weight:700;color:var(--ink-2)">' + esc(g.name) + '</div>' +
      g.items.map(function (r) {
        var sev = r.severity ? ['', 'เบา', 'ปานกลาง', 'ร้ายแรง', 'ร้ายแรงมาก'][r.severity] : '';
        return '<div class="pick-item' + (REC.rule && REC.rule.id === r.id ? ' on' : '') +
          '" onclick="pickRule(' + r.id + ')">' +
          '<div class="grow"><b>' + esc(r.name) + '</b>' +
            '<span>' + esc(r.code) + (r.oldCode ? ' (รหัสเดิม ' + esc(r.oldCode) + ')' : '') +
            (sev ? ' · ระดับ' + sev : '') +
            (r.requiresEvidence ? ' · ต้องมีหลักฐาน' : '') + '</span></div>' +
          '<div class="pick-pts" style="color:' +
            (r.kind === 'ความดี' ? 'var(--series-1)' : 'var(--series-2)') + '">' +
            (r.kind === 'ความดี' ? '+' : '−') + r.points + '</div>' +
        '</div>';
      }).join('');
  }).join('');
}

function pickRule(id) {
  REC.rule = REC.rules.filter(function (r) { return r.id === id; })[0];
  el('evidence-field').classList.toggle('hide', !REC.rule.requiresEvidence);
  renderRules();
}

function renderStudentPicker() {
  el('rec-student').innerHTML = REC.student
    ? '<div class="pick-item on" onclick="openStudentPicker()" style="border-radius:10px;border:1px solid var(--line)">' +
        '<div class="avatar">' + esc(initials(REC.student.name)) + '</div>' +
        '<div class="grow"><b>' + esc(REC.student.name) + '</b>' +
        '<span>' + esc(REC.student.classLabel) + ' · รหัส ' + esc(REC.student.code) +
        ' · คะแนน ' + REC.student.conductScore + '</span></div>' +
        '<span class="btn btn-ghost btn-sm">เปลี่ยน</span></div>'
    : '<button class="btn btn-block" onclick="openStudentPicker()" style="justify-content:flex-start">' +
        '🔍 ค้นหาชื่อหรือรหัสนักเรียน</button>';
}

function openStudentPicker() {
  openModal('เลือกนักเรียน',
    '<input type="search" id="sp-q" placeholder="พิมพ์ชื่อ นามสกุล รหัส หรือห้อง เช่น ม.1/1" ' +
      'autocomplete="off" style="margin-bottom:10px">' +
    '<div id="sp-list"><div class="empty small">พิมพ์อย่างน้อย 1 ตัวอักษรเพื่อค้นหา</div></div>');

  var input = el('sp-q');
  var timer;
  input.oninput = function () {
    clearTimeout(timer);
    var q = input.value.trim();
    if (!q) { el('sp-list').innerHTML = '<div class="empty small">พิมพ์อย่างน้อย 1 ตัวอักษรเพื่อค้นหา</div>'; return; }
    el('sp-list').innerHTML = '<div class="skeleton" style="height:60px"></div>';
    timer = setTimeout(function () {
      call('apiSearchStudents', [S.token, q, { limit: 25 }]).then(function (list) {
        el('sp-list').innerHTML = list.length
          ? '<div class="pick-list">' + list.map(function (s) {
              return '<div class="pick-item" onclick="chooseStudent(' + s.id + ')">' +
                '<div class="avatar">' + esc(initials(s.name)) + '</div>' +
                '<div class="grow"><b>' + esc(s.name) + '</b><span>' + esc(s.classLabel) +
                  ' · เลขที่ ' + esc(s.seat) + ' · รหัส ' + esc(s.code) + '</span></div>' +
                '<div class="pick-pts" style="color:' + scoreColor(s.conductScore) + '">' + s.conductScore + '</div>' +
              '</div>';
            }).join('') + '</div>'
          : '<div class="empty small">ไม่พบนักเรียนที่ค้นหา</div>';
        window._spList = list;
      }).catch(function (e) {
        el('sp-list').innerHTML = '<div class="alert alert-error">' + esc(e.message) + '</div>';
      });
    }, 280);
  };
  setTimeout(function () { input.focus(); }, 80);
}

function chooseStudent(id) {
  REC.student = (window._spList || []).filter(function (s) { return s.id === id; })[0];
  closeModal();
  renderStudentPicker();
}

function submitRecord(btn) {
  if (!REC.student) { toast('กรุณาเลือกนักเรียนก่อน', 'err'); return; }
  if (!REC.rule) { toast('กรุณาเลือกหลักเกณฑ์', 'err'); return; }
  var detail = el('rec-detail').value.trim();
  if (!detail) { toast('กรุณากรอกรายละเอียดเหตุการณ์', 'err'); el('rec-detail').focus(); return; }

  var when = el('rec-when').value;
  busy(btn, true);
  call('apiCreateRecord', [S.token, {
    studentId: REC.student.id,
    ruleId: REC.rule.id,
    detail: detail,
    location: el('rec-place').value.trim(),
    occurredAt: when ? when.replace('T', ' ') + ':00' : '',
    evidenceUrl: el('rec-evidence') ? el('rec-evidence').value.trim() : ''
  }]).then(function (res) {
    busy(btn, false, 'บันทึกและส่งให้พิจารณา');
    toast('บันทึก ' + res.recordNo + ' ส่งให้พิจารณาแล้ว', 'ok');
    REC.student = null; REC.rule = null;
    el('rec-detail').value = ''; el('rec-place').value = '';
    if (el('rec-evidence')) el('rec-evidence').value = '';
    el('evidence-field').classList.add('hide');
    renderStudentPicker();
    renderRules();
    loadMyRecords();
  }).catch(function (e) {
    busy(btn, false, 'บันทึกและส่งให้พิจารณา');
    toast(e.message, 'err');
  });
}

function loadMyRecords() {
  var box = el('my-records');
  if (!box) return;
  call('apiMyRecords', [S.token, 20]).then(function (list) {
    box.innerHTML = list.length
      ? '<div class="table-wrap"><table class="data"><thead><tr>' +
          '<th>นักเรียน</th><th>เกณฑ์</th><th class="num">คะแนน</th><th>สถานะ</th></tr></thead><tbody>' +
        list.map(function (r) {
          return '<tr><td><b>' + esc(r.studentName) + '</b><div class="small muted">' + esc(r.classLabel) +
            ' · ' + esc(r.occurredThai) + '</div></td>' +
            '<td>' + esc(r.ruleName) + '</td>' +
            '<td class="num" style="color:' + (r.kind === 'ความดี' ? 'var(--series-1)' : 'var(--series-2)') +
              ';font-weight:700">' + (r.kind === 'ความดี' ? '+' : '−') + r.points + '</td>' +
            '<td>' + statusBadge(r.status) +
              (r.reviewNote ? '<div class="small muted">' + esc(r.reviewNote) + '</div>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="empty"><div class="big">📝</div>ยังไม่มีบันทึกของคุณ</div>';
  }).catch(function (e) {
    box.innerHTML = '<div class="alert alert-error">' + esc(e.message) + '</div>';
  });
}

/* ------------------------------------------------------------------ */
/* 3. รออนุมัติ                                                        */
/* ------------------------------------------------------------------ */

VIEWS.approve = function (root) {
  return call('apiPendingRecords', [S.token]).then(function (list) {
    updatePendingBadge(list.length);
    if (!list.length) {
      root.innerHTML = '<div class="card"><div class="empty"><div class="big">🎉</div>' +
        '<b>ไม่มีบันทึกค้างพิจารณา</b><div class="small">บันทึกที่ส่งเข้ามาใหม่จะแสดงที่นี่</div></div></div>';
      return;
    }

    root.innerHTML =
      '<div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">' +
        '<span style="font-size:20px">⏳</span>' +
        '<div style="flex:1;min-width:200px"><b>รอพิจารณา ' + list.length + ' รายการ</b>' +
        '<div class="small muted">บันทึกจะมีผลต่อคะแนนนักเรียนเมื่ออนุมัติแล้วเท่านั้น ' +
        'ความผิดระดับร้ายแรงต้องให้ฝ่ายกิจการนักเรียนพิจารณา</div></div></div></div>' +
      '<div class="grid" style="gap:12px">' + list.map(pendingCard).join('') + '</div>';
  });
};

function pendingCard(r) {
  var isMerit = r.kind === 'ความดี';
  var sevText = r.severity ? ['', 'เบา', 'ปานกลาง', 'ร้ายแรง', 'ร้ายแรงมาก'][r.severity] : '';
  return '<div class="card" id="pc-' + r.id + '">' +
    '<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">' +
      '<div class="avatar" style="width:42px;height:42px;flex:0 0 42px;font-size:16px">' +
        esc(initials(r.studentName)) + '</div>' +
      '<div style="flex:1;min-width:200px">' +
        '<b style="font-size:15.5px">' + esc(r.studentName) + '</b>' +
        '<div class="small muted">' + esc(r.classLabel) + ' · รหัส ' + esc(r.studentCode) + '</div>' +
      '</div>' +
      '<div style="text-align:right">' +
        '<span class="badge ' + (isMerit ? 'badge-merit' : 'badge-demerit') + '">' +
          (isMerit ? '🌟 ' : '⚠️ ') + esc(r.kind) + '</span>' +
        '<div style="font-size:21px;font-weight:700;color:' +
          (isMerit ? 'var(--series-1)' : 'var(--series-2)') + '">' +
          (isMerit ? '+' : '−') + r.points + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="divider" style="margin:12px 0"></div>' +
    '<div style="font-size:14.5px;font-weight:600;margin-bottom:3px">' + esc(r.ruleCode) + ' ' + esc(r.ruleName) +
      (sevText ? ' <span class="badge">ระดับ' + esc(sevText) + '</span>' : '') + '</div>' +
    '<p style="font-size:14px;margin:6px 0">' + esc(r.detail) + '</p>' +
    '<div class="small muted">' + esc(r.occurredThai) +
      (r.location ? ' · ' + esc(r.location) : '') + ' · บันทึกโดย ' + esc(r.reportedBy) + '</div>' +
    (r.evidenceUrl ? '<div style="margin-top:8px"><a href="' + esc(r.evidenceUrl) +
      '" target="_blank" rel="noopener" class="btn btn-sm">📎 เปิดดูหลักฐาน</a></div>' : '') +
    (r.canDecide
      ? '<div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">' +
          '<button class="btn btn-good" style="flex:1" onclick="decide(' + r.id + ',\'approve\',this)">✓ อนุมัติ</button>' +
          '<button class="btn" style="flex:1" onclick="openReject(' + r.id + ')">✕ ไม่อนุมัติ</button>' +
        '</div>'
      : '<div class="alert alert-warn" style="margin:14px 0 0">⚠ ความผิดระดับร้ายแรง ' +
        'ต้องให้ฝ่ายกิจการนักเรียนเป็นผู้พิจารณา</div>') +
  '</div>';
}

function decide(id, decision, btn, note) {
  busy(btn, true);
  call('apiReviewRecord', [S.token, id, decision, note || ''])
    .then(function () {
      var card = el('pc-' + id);
      if (card) {
        card.style.transition = 'opacity .25s, transform .25s';
        card.style.opacity = '0'; card.style.transform = 'scale(.97)';
        setTimeout(function () { card.remove(); }, 260);
      }
      updatePendingBadge(Math.max(0, S.pendingCount - 1));
      toast(decision === 'approve' ? 'อนุมัติแล้ว คะแนนได้รับการปรับปรุง' : 'บันทึกไม่ได้รับอนุมัติ', 'ok');
    })
    .catch(function (e) { busy(btn, false); toast(e.message, 'err'); });
}

function openReject(id) {
  openModal('ไม่อนุมัติบันทึก',
    '<div class="field"><label>เหตุผล <span class="muted">(ผู้บันทึกจะเห็นข้อความนี้)</span></label>' +
    '<textarea id="rj-note" placeholder="เช่น ข้อมูลไม่เพียงพอ ควรระบุพยานหรือแนบหลักฐาน"></textarea></div>',
    '<button class="btn" onclick="closeModal()">ยกเลิก</button>' +
    '<button class="btn btn-danger" id="rj-ok">ไม่อนุมัติ</button>');
  el('rj-ok').onclick = function () {
    var note = el('rj-note').value.trim();
    if (!note) { toast('กรุณาระบุเหตุผล', 'err'); return; }
    closeModal();
    decide(id, 'reject', null, note);
  };
}
</script>

<script>
/* ------------------------------------------------------------------ */
/* 4. นักเรียน                                                         */
/* ------------------------------------------------------------------ */

var STU = { grade: '', room: '', q: '' };

VIEWS.students = function (root) {
  root.innerHTML =
    '<div class="card" style="margin-bottom:14px">' +
      '<div class="row" style="align-items:flex-end">' +
        '<div class="field" style="flex:2;margin-bottom:0"><label>ค้นหา</label>' +
          '<input type="search" id="stu-q" placeholder="ชื่อ นามสกุล หรือรหัสนักเรียน" value="' + esc(STU.q) + '"></div>' +
        '<div class="field" style="flex:1;margin-bottom:0"><label>ระดับชั้น</label>' +
          '<select id="stu-grade"><option value="">ทุกระดับ</option>' +
            [1,2,3,4,5,6].map(function (g) {
              return '<option value="' + g + '"' + (String(STU.grade) === String(g) ? ' selected' : '') +
                     '>ม.' + g + '</option>';
            }).join('') + '</select></div>' +
        '<div class="field" style="flex:1;margin-bottom:0"><label>ห้อง</label>' +
          '<input type="number" id="stu-room" min="1" placeholder="ทุกห้อง" value="' + esc(STU.room) + '"></div>' +
        '<button class="btn btn-primary" onclick="loadStudents()" style="flex:0 0 auto">ค้นหา</button>' +
        (S.perm['student.manage']
          ? '<button class="btn" onclick="openStudentForm()" style="flex:0 0 auto">+ เพิ่มนักเรียน</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="card"><div id="stu-result"><div class="skeleton" style="height:200px"></div></div></div>';

  ['stu-q'].forEach(function (id) {
    el(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') loadStudents(); });
  });
  return loadStudents();
};

function loadStudents() {
  STU.q = el('stu-q').value.trim();
  STU.grade = el('stu-grade').value;
  STU.room = el('stu-room').value;
  var box = el('stu-result');
  box.innerHTML = '<div class="skeleton" style="height:200px"></div>';

  return call('apiSearchStudents', [S.token, STU.q, { grade: STU.grade, room: STU.room, limit: 400 }])
    .then(function (list) {
      if (!list.length) {
        box.innerHTML = '<div class="empty"><div class="big">🔍</div>ไม่พบนักเรียนตามเงื่อนไขที่ค้นหา</div>';
        return;
      }
      box.innerHTML =
        '<div class="card-head"><h3>พบ ' + list.length + ' คน</h3>' +
          '<span class="hint">แตะที่แถวเพื่อดูประวัติรายบุคคล</span></div>' +
        '<div class="table-wrap"><table class="data"><thead><tr>' +
          '<th>นักเรียน</th><th>ห้อง</th><th class="num">คะแนนความประพฤติ</th>' +
          '<th class="num">ความดีสะสม</th><th class="num">ครั้งที่ทำผิด</th><th>ระดับ</th>' +
        '</tr></thead><tbody>' +
        list.map(function (s) {
          return '<tr class="clickable" onclick="openStudent(' + s.id + ')">' +
            '<td><b>' + esc(s.name) + '</b><div class="small muted">รหัส ' + esc(s.code) +
              ' · เลขที่ ' + esc(s.seat) + '</div></td>' +
            '<td>' + esc(s.classLabel) + '</td>' +
            '<td class="num"><b style="color:' + scoreColor(s.conductScore) + '">' + s.conductScore + '</b></td>' +
            '<td class="num">' + s.meritTotal + '</td>' +
            '<td class="num">' + (s.demeritCount || '—') + '</td>' +
            '<td>' + riskBadge(s.riskLevel) + '</td></tr>';
        }).join('') + '</tbody></table></div>';
    });
}

function openStudent(id) {
  openModal('ประวัติความประพฤติ', '<div class="skeleton" style="height:260px"></div>');
  call('apiGetStudent', [S.token, id]).then(function (d) {
    var s = d.student, b = d.balance;
    openModal(s.name,
      '<div style="display:flex;gap:14px;align-items:center;margin-bottom:16px;flex-wrap:wrap">' +
        '<div class="avatar" style="width:52px;height:52px;flex:0 0 52px;font-size:20px">' +
          esc(initials(s.name)) + '</div>' +
        '<div style="flex:1;min-width:150px"><b style="font-size:16px">' + esc(s.name) + '</b>' +
          '<div class="small muted">' + esc(s.classLabel) + ' · เลขที่ ' + esc(s.seat) +
          ' · รหัส ' + esc(s.code) + '</div></div>' +
        '<div style="text-align:right"><div style="font-size:30px;font-weight:700;color:' +
          scoreColor(b.conductScore) + '">' + b.conductScore + '</div>' +
          '<div class="small muted">คะแนนความประพฤติ</div></div>' +
      '</div>' +

function renderReportParams() {
  var meta = (window._reportList || []).filter(function (r) { return r.id === RPT.id; })[0];
  var box = el('rpt-params');
  if (!meta || !meta.needs.length) {
    box.innerHTML = RPT.id === 'R03'

        '<input type="number" id="rp-cutoff" value="70" min="1" max="100"></div>'
      : '';

  }
  if (meta.needs.indexOf('student') >= 0) {
    box.innerHTML = '<div class="field"><label>เลือกนักเรียน</label>' +
      '<div id="rp-student"><button class="btn" onclick="pickReportStudent()">🔍 ค้นหานักเรียน</button></div></div>';
  } else if (meta.needs.indexOf('class') >= 0) {
    box.innerHTML = '<div class="row" style="max-width:420px">' +
      '<div class="field"><label>ระดับชั้น</label><select id="rp-grade">' +

function collectReportParams() {

  if (el('rp-cutoff')) p.cutoff = el('rp-cutoff').value;

}

function runReport(btn) {
  busy(btn, true);
  call('apiBuildReport', [S.token, RPT.id, collectReportParams()])
    .then(function (r) {
      busy(btn, false, '👁 แสดงตัวอย่าง');
      RPT.current = r;
      el('rpt-result').innerHTML =
        '<div class="card">' +
          '<div class="card-head"><div><h3>' + esc(r.title) + '</h3>' +
            '<div class="small muted">' + esc(r.subtitle || '') + '</div></div>' +
            '<div class="right"><span class="badge">' + r.rowCount + ' แถว</span></div></div>' +
          (r.notes || []).map(function (n) {
            return '<div class="alert alert-info">' + esc(n) + '</div>';
          }).join('') +
          '<div class="table-wrap"><table class="data"><thead><tr>' +
            r.columns.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
          '</tr></thead><tbody>' +
            r.rows.map(function (row) {
              return '<tr>' + row.map(function (cell, i) {
                var isNum = typeof cell === 'number';
                return '<td' + (isNum ? ' class="num"' : '') + '>' + esc(cell) + '</td>';
              }).join('') + '</tr>';
            }).join('') +
          '</tbody></table></div>' +
          '<div class="small muted" style="margin-top:12px">ออกรายงานเมื่อ ' + esc(r.generatedAt) +
            ' โดย ' + esc(r.generatedBy) + ' · เอกสารนี้มีข้อมูลส่วนบุคคล โปรดใช้ในราชการเท่านั้น</div>' +
        '</div>';
      window.scrollTo({ top: el('rpt-result').offsetTop - 80, behavior: 'smooth' });
    })
    .catch(function (e) { busy(btn, false, '👁 แสดงตัวอย่าง'); toast(e.message, 'err'); });
}

function downloadReport(format, btn) {
  busy(btn, true);
  call('apiExportReport', [S.token, RPT.id, collectReportParams(), format])
    .then(function (f) {
      busy(btn, false, format === 'pdf' ? '📄 ดาวน์โหลด PDF' : '📊 ดาวน์โหลด Excel');
      downloadBase64(f.fileName, f.mimeType, f.base64);
      toast('สร้างไฟล์ ' + f.fileName + ' แล้ว', 'ok');
    })
    .catch(function (e) {
      busy(btn, false, format === 'pdf' ? '📄 ดาวน์โหลด PDF' : '📊 ดาวน์โหลด Excel');
      toast(e.message, 'err');
    });
}

function exportStudentReport(studentId) {
  RPT.id = 'R01';
  RPT.params.studentId = studentId;
  toast('กำลังสร้างรายงาน...');
  call('apiExportReport', [S.token, 'R01', { studentId: studentId }, 'pdf'])
    .then(function (f) { downloadBase64(f.fileName, f.mimeType, f.base64); toast('ดาวน์โหลดรายงานแล้ว', 'ok'); })
    .catch(function (e) { toast(e.message, 'err'); });
}

/** แปลง base64 เป็นไฟล์แล้วสั่งดาวน์โหลดในเบราว์เซอร์ */
function downloadBase64(fileName, mimeType, b64) {
  try {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var url = URL.createObjectURL(new Blob([bytes], { type: mimeType }));
    var a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
  } catch (e) {
    toast('เบราว์เซอร์นี้บล็อกการดาวน์โหลด กรุณาลองใช้ Chrome หรือเปิดเว็บแอปในแท็บใหม่', 'err');
  }
}
</script>
